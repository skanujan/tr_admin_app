name: Build signed app bundle

# Runs automatically whenever this repo is updated, and can also be started
# by hand from the Actions tab (the "Run workflow" button) - see README.md
# for how to download the result once it finishes.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets cannot be tested directly in a step's "if", so check them here once
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Recreates keystore.properties and the .keystore file from the
      # repository secrets you added, right before the build - so the real
      # signing key only ever exists on GitHub's temporary build machine,
      # never committed to the repo itself.
      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Recreates app/google-services.json from a secret, if you've set up
      # push notifications (see README.md). If you haven't, this step is
      # skipped and the app still builds fine, just without push.
      - name: Restore Firebase config
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build release App Bundle (.aab)
        run: ./gradlew bundleRelease

      - name: Build release APK (for quick testing on a phone)
        run: ./gradlew assembleRelease

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
